{{- if and (or .Values.secrets.create .Values.devPostgres.enabled) (not .Values.secretManager.enabled) }}
{{- $s := .Values.secrets }}
{{- $dp := .Values.devPostgres }}
{{- $host := include "satchel.devPgHost" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "satchel.devSecretName" . }}
  labels:
    {{- include "satchel.labels" . | nindent 4 }}
  annotations:
    {{- include "satchel.preHook" (dict "weight" "-10") | nindent 4 }}
type: Opaque
stringData:
  {{- if $dp.enabled }}
  SATCHEL_DATABASE_URL: {{ printf "postgresql+psycopg://satchel_app:%s@%s:5432/%s" $dp.appPassword $host $dp.database | quote }}
  SATCHEL_ADMIN_DATABASE_URL: {{ printf "postgresql+psycopg://satchel_worker:%s@%s:5432/%s" $dp.workerPassword $host $dp.database | quote }}
  SATCHEL_MIGRATION_DATABASE_URL: {{ printf "postgresql+psycopg://postgres:%s@%s:5432/%s" $dp.password $host $dp.database | quote }}
  SATCHEL_BOOTSTRAP_DATABASE_URL: {{ printf "postgresql+psycopg://postgres:%s@%s:5432/%s" $dp.password $host $dp.database | quote }}
  SATCHEL_APP_DB_PASSWORD: {{ $dp.appPassword | quote }}
  SATCHEL_WORKER_DB_PASSWORD: {{ $dp.workerPassword | quote }}
  {{- else }}
  SATCHEL_DATABASE_URL: {{ $s.databaseUrl | quote }}
  SATCHEL_ADMIN_DATABASE_URL: {{ $s.adminDatabaseUrl | quote }}
  SATCHEL_MIGRATION_DATABASE_URL: {{ $s.migrationDatabaseUrl | quote }}
  {{- end }}
  {{- with $s.oidcClientSecret }}
  SATCHEL_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.chatApiKey }}
  SATCHEL_CHAT_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.encryptionKey }}
  SATCHEL_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
