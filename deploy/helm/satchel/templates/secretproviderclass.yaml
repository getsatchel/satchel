{{- if .Values.secretManager.enabled }}
{{- range $name, $map := dict "sm" .Values.secretManager.secrets "sm-migrate" .Values.secretManager.migrationSecrets "sm-bootstrap" .Values.secretManager.bootstrapSecrets }}
{{- if $map }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "satchel.fullname" $ }}-{{ $name }}
  labels:
    {{- include "satchel.labels" $ | nindent 4 }}
  annotations:
    {{- include "satchel.preHook" (dict "weight" "-10") | nindent 4 }}
spec:
  {{- if eq $.Values.secretManager.provider "aws" }}
  provider: aws
  parameters:
    {{- with $.Values.aws.region }}
    region: {{ . | quote }}
    {{- end }}
    {{- if $.Values.secretManager.aws.usePodIdentity }}
    usePodIdentity: "true"
    {{- end }}
    objects: |
      {{- range $key, $ref := $map }}
      - objectName: {{ $ref | quote }}
        objectType: secretsmanager
        objectAlias: {{ $key | quote }}
      {{- end }}
  {{- else }}
  provider: gke
  parameters:
    secrets: |
      {{- range $key, $path := $map }}
      - resourceName: {{ $path | quote }}
        path: {{ $key | quote }}
      {{- end }}
  {{- end }}
  secretObjects:
    - secretName: {{ include "satchel.fullname" $ }}-{{ $name }}
      type: Opaque
      data:
        {{- range $key, $path := $map }}
        - objectName: {{ $key | quote }}
          key: {{ $key | quote }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
