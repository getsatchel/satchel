{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "satchel.serviceAccountName" . }}
  labels:
    {{- include "satchel.labels" . | nindent 4 }}
  annotations:
    {{- include "satchel.preHook" (dict "weight" "-10") | nindent 4 }}
    {{- with .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.awsRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- with .Values.serviceAccount.migration }}
{{- if .create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "satchel.migrationServiceAccountName" $ }}
  labels:
    {{- include "satchel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- include "satchel.preHook" (dict "weight" "-10") | nindent 4 }}
    {{- with .gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . | quote }}
    {{- end }}
    {{- with .awsRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
