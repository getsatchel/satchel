table: analytics.orders
endorsed: true
description: One row per customer order. The source of truth for orders and revenue.
grain: order_id
caveats: [caveats/refunds-pre-2023.md]
columns:
  order_id: { description: Primary key of the order }
  customer_id: { description: "Customer who placed the order. 0 is the internal test customer, always exclude it." }
  order_date: { description: Date the order was placed in Australia/Sydney time }
  status:
    description: Order lifecycle state. returned and return_pending orders are excluded from revenue.
    enum_values: [placed, shipped, completed, return_pending, returned]
  amount: { description: Order total including GST and shipping, unit: AUD cents }
